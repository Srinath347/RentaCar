# dealing-with-contention-v2 — task/eval profile: PostgreSQL, no Docker-compose auto-start,
# mail/rabbit tolerated-but-inert so the reservation concurrency path can be exercised in isolation.

# Datasource (PostgreSQL) — overridable via env; tests inject the Testcontainers URL dynamically.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rentacar}
spring.datasource.username=${DB_USER:rentacar}
spring.datasource.password=${DB_PASSWORD:rentacar_pass}
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway owns the schema
spring.flyway.enabled=true

# Do not let spring-boot-docker-compose try to boot RabbitMQ during the task
spring.docker.compose.enabled=false

# Placeholders that application.properties leaves without defaults — supply inert defaults
rentacar.front-end-url=${FRONT_END_URL:http://localhost:4200}
rentacar.back-end-url=${BACKEND_URL:http://localhost:8086}
rentacar.mail-sender.enabled=false
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.rabbitmq.username=${RABBIT_USERNAME:rentacar}
spring.rabbitmq.password=${RABBIT_PASSWORD:rentacar_pass}
